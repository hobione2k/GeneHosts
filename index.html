<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- 外部への通信を禁止するCSP(自ファイルのスクリプト・スタイルのみ許可) -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeneHosts</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <!-- 画面全体をまとめるパネル -->
  <div class="app">
  <header class="header">
    <!-- タイトルと説明文(中央列) -->
    <div class="title">
      <h1>GeneHosts</h1>
      <p class="subtitle">hosts(ホスト一覧)を連番生成</p>
    </div>
    <!-- テーマ切り替えボタン -->
    <button type="button" id="themeToggle" class="btn btn-sub btn-icon" aria-label="ダークテーマに切り替え" title="ダークテーマに切り替え">
      <!-- 月アイコン(ライト時に表示: ダークへ切り替え) -->
      <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
      <!-- 太陽アイコン(ダーク時に表示: ライトへ切り替え) -->
      <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <!-- アイコン横の文言(アイコンと同じ条件で切り替え) -->
      <span class="icon-moon">ダーク</span>
      <span class="icon-sun">ライト</span>
    </button>
  </header>

  <main class="main">
    <form id="genForm" class="form" novalidate>
      <!-- 入力パネルの見出し(出力側と高さを揃える) -->
      <div class="panel-head">
        <h2>入力</h2>
      </div>

      <!-- IPアドレス指定 -->
      <fieldset>
        <legend>IPv4アドレス</legend>
        <!-- プリフィックス・開始・終了を1行に配置 -->
        <div class="row">
          <label class="wide">プリフィックス
            <input type="text" id="ipPrefix" value="192.168.1." placeholder="192.168.1.">
          </label>
          <!-- 開始・終了は-1/+1ボタン付き(↑↓キーでも増減可) -->
          <label>開始
            <span class="stepper">
              <input type="text" id="ipStart" value="10" placeholder="10">
              <button type="button" class="step" data-target="ipStart" data-step="-1" aria-label="開始を1減らす">−</button>
              <button type="button" class="step" data-target="ipStart" data-step="1" aria-label="開始を1増やす">+</button>
            </span>
          </label>
          <label>終了
            <span class="stepper">
              <input type="text" id="ipEnd" value="20" placeholder="20">
              <button type="button" class="step" data-target="ipEnd" data-step="-1" aria-label="終了を1減らす">−</button>
              <button type="button" class="step" data-target="ipEnd" data-step="1" aria-label="終了を1増やす">+</button>
            </span>
          </label>
        </div>
        <p class="hint">例: プリフィックス「192.168.」+ 開始「1.10」も可</p>
      </fieldset>

      <!-- ホスト名指定 -->
      <fieldset>
        <legend>ホスト名</legend>
        <!-- プリフィックス・開始・終了・桁数を1行に配置 -->
        <div class="row">
          <label class="wide">プリフィックス
            <input type="text" id="hostPrefix" value="node" placeholder="node">
          </label>
          <label>開始番号
            <input type="number" id="hostStart" value="1" min="0">
          </label>
          <label>終了番号
            <input type="number" id="hostEnd" value="11" min="0">
          </label>
          <label>桁数
            <input type="number" id="hostDigits" value="2" min="1" max="10">
          </label>
        </div>
      </fieldset>
    </form>

    <!-- hosts形式の出力 -->
    <section class="output">
      <div class="panel-head">
        <h2>出力</h2>
        <!-- コピーボタン(アイコンのみ、見出し行の右端に配置) -->
        <button type="button" id="copyBtn" class="btn btn-sub btn-icon btn-icon-only" aria-label="クリップボードにコピー" title="クリップボードにコピー">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="9" width="12" height="12" rx="2"/>
            <path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>
          </svg>
        </button>
      </div>
      <textarea id="output" rows="10" readonly spellcheck="false"></textarea>
    </section>
  </main>
  </div>

  <!-- フッター(画面下端に配置、リポジトリとライセンスへのリンク) -->
  <footer class="footer">
    <a href="https://github.com/hobione2k/GeneHosts" target="_blank" rel="noopener noreferrer">Repository</a>
    <span class="sep" aria-hidden="true">|</span>
    <a href="https://github.com/hobione2k/GeneHosts/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">MIT License</a>
  </footer>

  <!-- フローティング通知 -->
  <div id="message" class="toast" role="status" aria-live="polite"></div>

  <script src="./js/main.js"></script>
</body>
</html>
